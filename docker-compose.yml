version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/app.db
      JWT_SECRET: dev-secret-change-in-production-minimum-32-characters-required
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_SECONDS: 3600
      SESSION_INACTIVITY_SECONDS: 900
      RATE_LIMIT_ENABLED: "true"
      CORS_ORIGINS: http://localhost:80
      DEBUG: "true"
    volumes:
      - backend-data:/data
    expose:
      - "9000"
    x-preview-port: 9000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_HOST: backend
    ports:
      - "80:80"
    x-preview-port: 80
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend-data:
    driver: local
