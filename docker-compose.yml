version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    x-preview-port: 8000
    ports:
      - "8000:8000"
    env_file:
      - backend/dev.env
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_HOST: backend
    x-preview-port: 80
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
    driver: local
