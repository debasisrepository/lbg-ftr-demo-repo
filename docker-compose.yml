version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lbg-ftr-backend
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - JWT_SECRET_KEY=local-dev-secret-key-change-in-production-d4f5e6a7b8c9
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_MINUTES=480
      - CORS_ORIGINS=http://localhost:80
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_LOGIN_ATTEMPTS=5
      - RATE_LIMIT_LOGIN_WINDOW_SECONDS=300
      - DEBUG=false
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    x-preview-port: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - BACKEND_HOST=backend
    container_name: lbg-ftr-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    x-preview-port: 80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend-data:
