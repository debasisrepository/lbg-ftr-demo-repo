name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  POSTGRES_VERSION: '15'

jobs:
  backend-lint-and-type-check:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff mypy pytest
      
      - name: Run linter (ruff)
        working-directory: backend
        run: |
          ruff check app --select E,F,W,C,N --ignore E501
      
      - name: Run type checking (mypy)
        working-directory: backend
        run: |
          mypy app --ignore-missing-imports

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint-and-type-check
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install '.[postgres]'
          pip install pytest pytest-cov
      
      - name: Run database migrations (PostgreSQL)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://testuser:testpass@localhost:5432/testdb
        run: |
          cp dev.env .env
          alembic upgrade head
      
      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term --cov-report=html
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true
      
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
        if: always()

  frontend-lint-and-type-check:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run linter (ESLint)
        working-directory: frontend
        run: npm run lint
      
      - name: Run type checking (TypeScript)
        working-directory: frontend
        run: npm run type-check

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint-and-type-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --coverage
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
        continue-on-error: true
      
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      
      - name: Setup backend for E2E
        working-directory: backend
        run: |
          cp dev.env .env
          alembic upgrade head
          python seed.py
        env:
          DATABASE_URL: sqlite:///./e2e_test.db
      
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true
      
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: frontend/test-results/
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        run: |
          docker compose build backend
      
      - name: Build frontend image
        run: |
          docker compose build frontend
      
      - name: Test docker-compose stack (SQLite)
        run: |
          docker compose up -d
          sleep 15
          docker compose ps
          curl -f http://localhost:9000/health || exit 1
          curl -f http://localhost:80/ || exit 1
          docker compose logs backend
          docker compose logs frontend
          docker compose down -v
      
      - name: Test docker-compose stack (PostgreSQL)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
          sleep 20
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml ps
          curl -f http://localhost:9000/health || exit 1
          curl -f http://localhost:80/ || exit 1
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml logs backend
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml logs frontend
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml down -v
      
      - name: Save Docker images
        run: |
          docker save lbg-ftr-demo-repo-backend:latest | gzip > backend-image.tar.gz
          docker save lbg-ftr-demo-repo-frontend:latest | gzip > frontend-image.tar.gz
      
      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend-image.tar.gz
          retention-days: 7
      
      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-docker-image
          path: frontend-image.tar.gz
          retention-days: 7

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [backend-lint-and-type-check, frontend-lint-and-type-check]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Set up Python for Bandit
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Run Bandit security linter
        run: |
          pip install bandit[toml]
          bandit -r backend/app -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        if: always()

  integration-report:
    name: Integration Report
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-test, docker-build, security-scan]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Generate integration summary
        run: |
          echo "# CI Pipeline Integration Summary" > summary.md
          echo "" >> summary.md
          echo "## Build Status" >> summary.md
          echo "- Backend Tests: ${{ needs.backend-test.result }}" >> summary.md
          echo "- Frontend Tests: ${{ needs.frontend-test.result }}" >> summary.md
          echo "- E2E Tests: ${{ needs.e2e-test.result }}" >> summary.md
          echo "- Docker Build: ${{ needs.docker-build.result }}" >> summary.md
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> summary.md
          echo "" >> summary.md
          echo "## Artifacts Generated" >> summary.md
          ls -la
          cat summary.md >> $GITHUB_STEP_SUMMARY
      
      - name: Upload integration summary
        uses: actions/upload-artifact@v4
        with:
          name: integration-summary
          path: summary.md
