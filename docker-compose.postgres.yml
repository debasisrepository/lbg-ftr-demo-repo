version: '3.8'

# PostgreSQL override - use with: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up

services:
  database:
    image: postgres:16-alpine
    container_name: lbg-ftr-database
    environment:
      - POSTGRES_USER=lbg_ftr
      - POSTGRES_PASSWORD=local_dev_password
      - POSTGRES_DB=lbg_ftr_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lbg_ftr"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - INSTALL_SPEC=.[postgres]
    environment:
      - DATABASE_URL=postgresql+psycopg://lbg_ftr:local_dev_password@database:5432/lbg_ftr_db
    depends_on:
      database:
        condition: service_healthy
    volumes: []  # Remove SQLite volume

volumes:
  postgres-data:
