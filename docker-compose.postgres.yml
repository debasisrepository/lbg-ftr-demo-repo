version: '3.8'

services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: clearpath
      POSTGRES_PASSWORD: clearpath_dev
      POSTGRES_DB: clearpath
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_SPEC: ".[postgres]"
    environment:
      DATABASE_URL: postgresql+psycopg://clearpath:clearpath_dev@database:5432/clearpath
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
