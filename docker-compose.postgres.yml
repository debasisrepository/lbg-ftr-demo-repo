version: '3.8'

# Optional PostgreSQL override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.postgres.yml up

services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: clearpath
      POSTGRES_PASSWORD: clearpath
      POSTGRES_DB: clearpath
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearpath"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_SPEC: ".[postgres]"
    environment:
      DATABASE_URL: postgresql+psycopg://clearpath:clearpath@database:5432/clearpath
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
