version: '3.8'

# Optional PostgreSQL override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.postgres.yml up

services:
  database:
    image: postgres:16-alpine
    container_name: lbg-ftr-database
    environment:
      - POSTGRES_USER=lbgapp
      - POSTGRES_PASSWORD=dev-postgres-password
      - POSTGRES_DB=lbg_ftr_demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_TARGET: ".[postgres]"
    environment:
      - DATABASE_URL=postgresql+psycopg://lbgapp:dev-postgres-password@database:5432/lbg_ftr_demo
    depends_on:
      - database

volumes:
  postgres-data:
